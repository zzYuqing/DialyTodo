[package]
name = "daily-todo"
version = "0.2.4"
description = "DailyTodo —— Windows 本地轻量待办工具"
authors = ["YoYo"]
edition = "2021"
rust-version = "1.77.2"

# 产物名必须与 tauri.conf.json 的 productName 一致
[lib]
name = "daily_todo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# 依赖仅限提示词 3.2 白名单内的 Tauri 官方插件 + window-vibrancy
[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
window-vibrancy = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
